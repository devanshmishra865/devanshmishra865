<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Devansh Mishra — build, debug, contribute</title><desc id="desc">Animated developer terminal with a blinking cursor and glowing nodes on a branching code graph.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#253249" stroke-width=".5"/></pattern></defs>
<style>@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}.cursor{animation:blink 1.2s step-end infinite}.flow{animation:flow 6s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.cursor,.flow,.pulse{animation:none}}</style>
<rect x="1" y="1" width="958" height="338" rx="18" fill="url(#bg)" stroke="#30415a"/><rect x="1" y="1" width="958" height="338" rx="18" fill="url(#grid)" opacity=".45"/>
<path d="M1 48H959" stroke="#30415a"/><circle cx="26" cy="25" r="6" fill="#fb7185"/><circle cx="48" cy="25" r="6" fill="#fbbf24"/><circle cx="70" cy="25" r="6" fill="#34d399"/>
<g font-family="Consolas, 'Courier New', monospace"><text x="94" y="30" fill="#94a3b8" font-size="13">devansh@github: ~/open-source</text><text x="36" y="92" fill="#34d399" font-size="15">$ whoami</text><text x="34" y="145" fill="#f1f5f9" font-size="43" font-weight="700">Devansh Mishra</text><text x="36" y="180" fill="#93c5fd" font-size="19">Java Full-Stack &amp; AI Developer</text><text x="36" y="224" fill="#94a3b8" font-size="15">Curiosity in. Code out.</text><text x="36" y="262" fill="#34d399" font-size="16">$ build • debug • contribute</text><rect class="cursor" x="326" y="247" width="10" height="19" fill="#34d399"/><text x="36" y="310" fill="#64748b" font-size="12">JAVA / SPRING BOOT / REACT / PYTHON</text></g>
<g fill="none" stroke="url(#line)" stroke-width="2"><path d="M690 274V103Q690 80 713 80H853"/><path d="M690 231Q690 205 720 205H794Q824 205 824 175V125"/><path d="M690 148H753Q778 148 778 123V80"/><path class="flow" d="M690 274V103Q690 80 713 80H853" stroke="#67e8f9" stroke-dasharray="8 22"/></g>
<g fill="#111827" stroke="#38bdf8" stroke-width="3"><circle cx="690" cy="274" r="8"/><circle cx="690" cy="148" r="8"/><circle cx="778" cy="80" r="8"/><circle cx="853" cy="80" r="8"/><circle cx="824" cy="125" r="8"/><circle cx="754" cy="205" r="8"/></g><g fill="#a78bfa"><circle class="pulse" cx="853" cy="80" r="4"/><circle class="pulse" cx="824" cy="125" r="4" style="animation-delay:1s"/><circle class="pulse" cx="754" cy="205" r="4" style="animation-delay:2s"/></g><text x="748" y="284" fill="#a78bfa" font-size="43" font-family="monospace">&lt;/&gt;</text>
</svg>
